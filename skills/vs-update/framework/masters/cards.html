<section class="slide center" {{attrs}}>
  {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
  <h2>{{title}}</h2>
  <div class="cards c{{cols}}">
    {{#items}}<div class="card {{style}} anim">{{#icon}}<div class="vs-ic">{{>icon icon}}</div>{{/icon}}{{#n}}<div class="n">{{n}}</div>{{/n}}{{#tag}}<div class="m">{{tag}}</div>{{/tag}}<h3>{{title}}</h3><p>{{text}}</p></div>{{/items}}
  </div>
  {{notes}}
</section>
