<!--vs {"name": "chapter", "order": 20, "use": "Opens a part of the deck. Its title becomes the chapter name in outline and footer.", "slots": {"photo": "a photo of the brand behind the text, darkened so the text stays readable: brand:images/<file> (optional; false keeps the slide without one)", "number": "chapter number, 1 to 99", "kicker": "small label above the title (eyebrow): only when the user asks for one; leave it empty otherwise, and always when the brand's rules say kicker false", "title": "name of the chapter", "lead": "one sentence that opens it (optional)", "video": "a video file that plays silently in a loop behind the text while the slide is shown: relative to the deck folder, or brand:videos/<file> for a film of the brand library (optional; a deck with a video is a folder); it is darkened so the title stays readable"}, "sample": {"number": 1, "title": "The <em>first</em> part", "lead": "A chapter slide opens each part of the deck."}, "is_chapter": true} -->
<section class="slide dark chapter{{#photo}} withphoto{{/photo}}{{#motion}} mslide mchap mcount{{/motion}}" {{attrs}}>
  {{#photo}}<div class="bgphoto"><img src="{{photo}}" alt=""></div>{{/photo}}{{>bgvideo}}
  <div class="wedge narrow{{#motion}} mwipe{{/motion}}"></div>
  {{#motion}}{{>chapter_number number}}{{/motion}}{{^motion}}<div class="ghost">{{number}}</div>{{/motion}}
  <div class="text">
    {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
    <h2{{#motion}} class="mtext"{{/motion}}>{{title}}</h2>
    {{#lead}}<p class="lead">{{lead}}</p>{{/lead}}
  </div>
  {{notes}}
</section>
