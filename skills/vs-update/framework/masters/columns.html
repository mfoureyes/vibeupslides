<section class="slide center" {{attrs}}>
  {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
  <h2>{{title}}</h2>
  <div class="columns" style="grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr">
    {{#columns}}<div class="anim">{{#icon}}<div class="vs-ic">{{>icon icon}}</div>{{/icon}}<h3>{{title}}</h3>{{#text}}<p>{{text}}</p>{{/text}}{{#bullets.0}}<ul class="bullets">{{/bullets.0}}{{#bullets}}<li>{{.}}</li>{{/bullets}}{{#bullets.0}}</ul>{{/bullets.0}}</div>{{/columns}}
  </div>
  {{notes}}
</section>
