<section class="slide exercise" {{attrs}}>
  {{#badge}}<div class="badge">{{badge}}</div>{{/badge}}
  {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
  <h2>{{title}}</h2>
  <div class="frame"><div><ul class="bullets">{{#steps}}<li class="anim">{{.}}</li>{{/steps}}</ul></div>
  <aside class="f">{{#facts}}<div><small>{{label}}</small><span>{{value}}</span></div>{{/facts}}</aside></div>
  {{notes}}
</section>
