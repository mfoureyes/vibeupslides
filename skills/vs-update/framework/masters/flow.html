<!--vs {"name": "flow", "order": 51, "use": "How things hang together: two to four boxes joined by arrows, one of them in the accent colour (who gives what to whom: the shop floor, the planning, the warehouse). One sentence below says what follows from it. For steps in time use steps or process.", "slots": {"kicker": "small label above the title (optional)", "title": "the title as a full sentence, <em> marks the one accent word", "lead": "one sentence under the title (optional)", "items": "list of 2 to 4 {tag, title, text, style}; style \"accent\" marks the one box the slide is about", "note": "one sentence below the boxes (optional)", "step": "true: the boxes appear one by one on click"}, "sample": {"kicker": "Flow", "title": "The system connects the shop floor with the <em>warehouse</em>", "items": [{"tag": "Shop floor", "title": "Shift", "text": "Reports a fault on the tablet at the line."}, {"tag": "Planning", "title": "Maintenance system", "text": "Plans the job and reserves the parts it needs.", "style": "accent"}, {"tag": "Supply", "title": "Warehouse", "text": "Has the parts ready before the technician comes."}], "note": "One sentence that says what follows from the picture."}} -->
<section class="slide vs-flw" {{attrs}}>
  <style>
  .vs-flw .vs-fl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:96px;margin-top:72px}
  .vs-flw .vs-fl-box{position:relative;border:1px solid var(--line);background:var(--paper);padding:40px 38px 42px;min-height:300px}
  .vs-flw .vs-fl-box.vs-fl-accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent,var(--on))}
  .vs-flw .vs-fl-box small{display:block;font-weight:700;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);margin-bottom:18px}
  .vs-flw .vs-fl-box h3{font-size:38px;line-height:1.2;font-weight:var(--w-head)}
  .vs-flw .vs-fl-box p{font-size:26px;line-height:1.45;margin-top:14px;color:var(--muted)}
  .vs-flw .vs-fl-box.vs-fl-accent small,.vs-flw .vs-fl-box.vs-fl-accent p,.vs-flw .vs-fl-box.vs-fl-accent h3{color:inherit}
  .vs-flw .vs-fl-box+.vs-fl-box::before{content:"";position:absolute;left:-76px;top:50%;width:52px;height:4px;margin-top:-2px;background:var(--accent)}
  .vs-flw .vs-fl-box+.vs-fl-box::after{content:"";position:absolute;left:-40px;top:50%;width:18px;height:18px;margin-top:-11px;border-top:4px solid var(--accent);border-right:4px solid var(--accent);transform:rotate(45deg)}
  .vs-flw .callout{margin-top:48px}
  </style>
  {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
  <h2>{{title}}</h2>
  {{#lead}}<p class="lead">{{lead}}</p>{{/lead}}
  <div class="vs-fl" data-seq>{{#items}}<div class="vs-fl-box vs-fl-{{style}} {{#step}}{{#@first}}anim{{/@first}}{{^@first}}f{{/@first}}{{/step}}{{^step}}anim{{/step}}">{{#tag}}<small>{{tag}}</small>{{/tag}}<h3>{{title}}</h3>{{#text}}<p>{{text}}</p>{{/text}}</div>{{/items}}</div>
  {{#note}}<p class="callout anim">{{note}}</p>{{/note}}
  {{notes}}
</section>
