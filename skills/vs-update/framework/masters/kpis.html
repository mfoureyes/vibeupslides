<!--vs {"name": "kpis", "order": 44, "use": "Two to four large numbers. One number per item, ranges go into the label.", "slots": {"kicker": "small label above the title (eyebrow): only when the user asks for one; leave it empty otherwise, and always when the brand's rules say kicker false", "title": "the title as a full sentence, <em> marks the one accent word", "items": "list of {value, unit, label}; unit is short (%, x, k)", "logo": "the logo of the programme or product the numbers belong to, top right under the header (optional)"}, "sample": {"title": "The numbers <em>at a glance</em>", "source": "Sample figures", "items": [{"value": "12", "label": "what the first figure means"}, {"value": "80", "label": "what the second figure means"}, {"value": "40", "unit": "%", "label": "what the third figure means"}, {"value": "3", "unit": "x", "label": "what the fourth figure means"}]}} -->
<section class="slide center" {{attrs}}>
  {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
  {{#logo}}<img class="vs-kpilogo" src="{{logo}}" alt="">{{/logo}}
  <h2>{{title}}</h2>
  <div class="kpis">
    {{#items}}<div class="kpi"><div class="w">{{value}}{{#unit}}<small>{{unit}}</small>{{/unit}}</div><div class="b">{{label}}</div></div>{{/items}}
  </div>
  {{notes}}
</section>
