<section class="slide vs-doc vs-prc" {{attrs}}>
  <style>
  .vs-doc{display:flex;flex-direction:column;padding-bottom:150px}
  .vs-topic{flex:none;font-weight:700;font-size:22px;line-height:1.3;color:var(--accent-text);margin-bottom:12px}
  .vs-doc>h2{flex:none;font-size:46px;line-height:1.14;max-width:1680px;margin-bottom:0}
  .vs-pt{width:100%;border-collapse:collapse;margin-top:44px;font-size:24px;line-height:1.3;font-variant-numeric:tabular-nums;color:var(--ink)}
  .vs-pt th{font-weight:700;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 0 14px 72px;border-bottom:1px solid var(--ink);text-align:right;white-space:nowrap;width:1%}
  .vs-pt td{padding:14px 0 14px 72px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  .vs-pt th:first-child,.vs-pt td:first-child,.vs-pt.tc2 th:nth-child(2),.vs-pt.tc2 td:nth-child(2),.vs-pt.tc3 th:nth-child(-n+3),.vs-pt.tc3 td:nth-child(-n+3){text-align:left;white-space:normal;width:auto}
  .vs-pt.tc3 th:nth-child(2),.vs-pt.tc3 td:nth-child(2){text-align:left;white-space:normal;width:auto}
  .vs-pt th:first-child,.vs-pt td:first-child{padding-left:0}
  .vs-pt tbody td:first-child,.vs-pt tbody td:last-child{font-weight:700}
  .vs-pt tbody tr:last-child td{border-bottom:0}
  .vs-pt tfoot td{border-bottom:0;padding-top:9px;padding-bottom:5px;font-weight:400}
  .vs-pt tfoot tr:first-child td{border-top:2px solid var(--ink);padding-top:16px}
  .vs-pt tfoot tr:last-child td{font-weight:700;font-size:28px}
  .vs-pt tfoot tr:last-child td:last-child{font-family:var(--font-head);font-size:38px;line-height:1;color:var(--accent-text)}
  .vs-tnote{font-size:20px;line-height:1.45;color:var(--muted);margin-top:22px;max-width:1400px}
  </style>
  {{#topic}}<div class="vs-topic">{{topic}}</div>{{/topic}}{{^topic}}{{#kicker}}<div class="vs-topic">{{kicker}}</div>{{/kicker}}{{/topic}}
  <h2>{{title}}</h2>
  <table class="vs-pt tc{{text_cols}}">
    <thead><tr>{{#head}}<th>{{.}}</th>{{/head}}</tr></thead>
    <tbody>{{#rows}}<tr>{{#.}}<td>{{.}}</td>{{/.}}</tr>{{/rows}}</tbody>
    <tfoot>{{#totals}}<tr>{{#.}}<td>{{.}}</td>{{/.}}</tr>{{/totals}}</tfoot>
  </table>
  {{#note}}<p class="vs-tnote">{{note}}</p>{{/note}}
  {{notes}}
</section>
