<section class="slide vs-doc vs-rqm" {{attrs}}>
  <style>
  .vs-doc{display:flex;flex-direction:column;padding-bottom:150px}
  .vs-topic{flex:none;font-weight:700;font-size:22px;line-height:1.3;color:var(--accent-text);margin-bottom:12px}
  .vs-doc>h2{flex:none;font-size:46px;line-height:1.14;max-width:1680px;margin-bottom:0}
  .vs-req{margin-top:40px}
  .vs-req-head,.vs-req-row{display:grid;grid-template-columns:1fr 72px 1.35fr}
  .vs-req-head{font-weight:700;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-bottom:12px}
  .vs-req-head span:first-child{padding-left:26px}
  .vs-req-row{margin-bottom:10px;font-size:24px;line-height:1.35;color:var(--ink)}
  .vs-req-need{display:flex;align-items:center;background:var(--soft);border-radius:min(var(--radius),20px);padding:17px 26px}
  .vs-req-row>i{align-self:center;justify-self:center;width:15px;height:15px;margin-left:-8px;border-top:3px solid var(--accent);border-right:3px solid var(--accent);transform:rotate(45deg)}
  .vs-req-ans{display:flex;align-items:center;justify-content:space-between;gap:28px;padding:17px 0;border-bottom:1px solid var(--line)}
  .vs-req-ans small{flex:none;font-size:18px;font-weight:700;letter-spacing:.04em;color:var(--accent-text);white-space:nowrap}
  </style>
  {{#topic}}<div class="vs-topic">{{topic}}</div>{{/topic}}{{^topic}}{{#kicker}}<div class="vs-topic">{{kicker}}</div>{{/kicker}}{{/topic}}
  <h2>{{title}}</h2>
  <div class="vs-req">
    <div class="vs-req-head"><span>{{head.0}}</span><span></span><span>{{head.1}}</span></div>
    {{#rows}}<div class="vs-req-row"><div class="vs-req-need anim">{{need}}</div><i class="anim" data-wave="2"></i><div class="vs-req-ans anim" data-wave="2"><span>{{answer}}</span>{{#ref}}<small>{{ref}}</small>{{/ref}}</div></div>{{/rows}}
  </div>
  {{notes}}
</section>
