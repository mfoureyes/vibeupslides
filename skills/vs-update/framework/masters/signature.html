<section class="slide vs-doc vs-sgn" {{attrs}}>
  <style>
  .vs-doc{display:flex;flex-direction:column;padding-bottom:150px}
  .vs-topic{flex:none;font-weight:700;font-size:22px;line-height:1.3;color:var(--accent-text);margin-bottom:12px}
  .vs-doc>h2{flex:none;font-size:46px;line-height:1.14;max-width:1680px;margin-bottom:0}
  .vs-sig-lead{margin-top:30px;font-size:27px;line-height:1.5;max-width:1400px}
  .vs-sig{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:120px;margin-top:56px}
  .vs-sig-org{font-family:var(--font-head);font-weight:var(--w-head);font-size:31px;line-height:1.2;color:var(--ink)}
  .vs-sig-line{display:flex;align-items:flex-end;height:74px;padding-bottom:8px;border-bottom:2px solid var(--ink);font-size:26px;color:var(--ink)}
  .vs-sig-line.tall{height:112px}
  .vs-sig small{display:block;font-size:20px;line-height:1.35;color:var(--muted);margin-top:8px}
  .vs-sig small b{display:block;font-size:22px}
  .vs-sig-signers{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:40px}
  </style>
  {{#topic}}<div class="vs-topic">{{topic}}</div>{{/topic}}{{^topic}}{{#kicker}}<div class="vs-topic">{{kicker}}</div>{{/kicker}}{{/topic}}
  <h2>{{title}}</h2>
  {{#lead}}<p class="vs-sig-lead">{{lead}}</p>{{/lead}}
  <div class="vs-sig">
    {{#parties}}<div class="anim"><div class="vs-sig-org">{{org}}</div>
      <div class="vs-sig-line">{{place_date}}</div><small>{{labels.place_date}}</small>
      <div class="vs-sig-signers">{{#signers}}<div><div class="vs-sig-line tall"></div><small><b>{{name}}</b>{{role}}</small></div>{{/signers}}{{^signers}}<div><div class="vs-sig-line tall"></div><small>{{labels.signature}}</small></div>{{/signers}}</div>
    </div>{{/parties}}
  </div>
  {{notes}}
</section>
