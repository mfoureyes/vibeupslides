<!--vs {"name": "statement", "order": 30, "use": "One sentence alone on a dark slide.", "slots": {"text": "the sentence, <em> marks the accent word", "who": "attribution (optional)"}, "sample": {"text": "Sometimes a <em>single</em> sentence is enough."}} -->
<section class="slide dark statement{{#motion}} mslide mstatement{{/motion}}" {{attrs}}>
  <div class="wedge narrow"></div>
  <div class="text" style="max-width:1000px"><h2{{#motion}} class="mtext"{{/motion}}>{{text}}</h2>{{#who}}<div class="who">{{who}}</div>{{/who}}</div>
  {{notes}}
</section>
