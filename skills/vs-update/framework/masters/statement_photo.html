<!--vs {"name": "statement_photo", "order": 31, "use": "One sentence over a full-bleed photo, or over a plain colour field when there is no photo, and nothing else. For the one idea of a keynote. Up to about 90 characters.", "slots": {"text": "the sentence, up to about 90 characters (four lines); <em> marks the accent word", "photo": "image file, at least 1600 px wide, calm enough to carry text (optional)", "surface": "the colour field when there is no photo: \"dark\" (default) or \"accent\"", "credit": "photo credit, set small in the corner (optional)", "video": "a video file that plays silently in a loop behind the text while the slide is shown: relative to the deck folder, or brand:videos/<file> for a film of the brand library (optional; a deck with a video is a folder)"}, "defaults": {"surface": "dark"}, "sample": {"photo": "@photo", "text": "One sentence over a photo that carries the whole <em>idea</em>."}, "full_images": true} -->
<section class="slide {{#photo}}fullbleed{{/photo}}{{^photo}}{{surface}}{{/photo}} vs-stp" {{attrs}}>
  <style>
  .vs-stp{display:flex;align-items:center;padding:0}
  .vs-stp .image::after{background:linear-gradient(90deg,rgba(43,43,45,.82) 0%,rgba(43,43,45,.6) 55%,rgba(43,43,45,.3) 100%)}
  .vs-stp .text{position:relative;z-index:2;padding:0 var(--pad);max-width:1640px}
  .vs-stp h2{font-family:var(--font-head);font-weight:var(--w-display);font-size:96px;line-height:1.05;letter-spacing:-.015em;max-width:none;margin:0}
  .vs-stp-credit{position:absolute;right:var(--pad);bottom:100px;z-index:2;font-size:18px;color:color-mix(in srgb,var(--on) 70%,transparent)}
  </style>
  {{#photo}}<div class="image"><img src="{{photo}}" alt="">{{>bgvideo}}</div>{{/photo}}{{^photo}}{{>bgvideo}}{{/photo}}
  <div class="text"><h2>{{text}}</h2></div>
  {{#credit}}<div class="vs-stp-credit">{{credit}}</div>{{/credit}}
  {{notes}}
</section>
