<section class="slide center" {{attrs}}>
  {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
  <h2>{{title}}</h2>
  <div class="team" style="grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr">
    {{#people}}<div class="person anim"><div class="pic">{{#photo}}<img src="{{photo}}" alt="">{{/photo}}</div><b>{{name}}</b><span>{{role}}</span>{{#contact}}<small>{{contact}}</small>{{/contact}}</div>{{/people}}
  </div>
  {{notes}}
</section>
