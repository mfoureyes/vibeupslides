<section class="slide vs-doc vs-trm" {{attrs}}>
  <style>
  .vs-doc{display:flex;flex-direction:column;padding-bottom:150px}
  .vs-topic{flex:none;font-weight:700;font-size:22px;line-height:1.3;color:var(--accent-text);margin-bottom:12px}
  .vs-doc>h2{flex:none;font-size:46px;line-height:1.14;max-width:1680px;margin-bottom:0}
  .vs-terms{margin-top:40px;column-count:2;column-gap:88px;column-rule:1px solid var(--line);font-size:20px;line-height:1.5;color:var(--ink)}
  .vs-terms.c3{column-count:3;column-gap:64px;font-size:18px}
  .vs-terms div{margin-bottom:18px}
  .vs-terms div:last-child{margin-bottom:0}
  .vs-terms h3{font-size:inherit;line-height:inherit;font-weight:700;color:var(--ink);break-after:avoid}
  .vs-terms p{font-size:inherit;line-height:inherit;orphans:2;widows:2}
  </style>
  {{#topic}}<div class="vs-topic">{{topic}}</div>{{/topic}}{{^topic}}{{#kicker}}<div class="vs-topic">{{kicker}}</div>{{/kicker}}{{/topic}}
  <h2>{{title}}</h2>
  <div class="vs-terms c{{cols}}">
    {{#sections}}<div>{{#head}}<h3>{{head}}</h3>{{/head}}<p>{{text}}</p></div>{{/sections}}
  </div>
  {{notes}}
</section>
