<section class="slide vs-doc vs-tm" {{attrs}}>
  <style>
  .vs-doc{display:flex;flex-direction:column;padding-bottom:150px}
  .vs-topic{flex:none;font-weight:700;font-size:22px;line-height:1.3;color:var(--accent-text);margin-bottom:12px}
  .vs-doc>h2{flex:none;font-size:46px;line-height:1.14;max-width:1680px;margin-bottom:0}
  .vs-tm{justify-content:center}
  .vs-tm-grid{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:32px;margin-top:48px}
  .vs-tm figure{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);padding:34px 36px 32px}
  .vs-tm-mark{display:block;height:62px;font-family:var(--font-head);font-weight:var(--w-display);font-size:96px;line-height:1;color:var(--accent-text)}
  .vs-tm blockquote{font-size:28px;line-height:1.45;color:var(--ink);margin-bottom:34px}
  .vs-tm figcaption{margin-top:auto;display:flex;align-items:center;gap:20px}
  .vs-tm-pic{width:84px;height:84px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft)}
  .vs-tm-logo{height:44px;width:auto;max-width:150px;object-fit:contain;flex:none}
  .vs-tm figcaption b{display:block;font-size:24px;line-height:1.25}
  .vs-tm figcaption span{display:block;font-size:20px;line-height:1.3;color:var(--muted);margin-top:3px}
  .vs-tm figure:first-child:nth-last-child(2),.vs-tm figure:nth-child(2):last-child{padding:44px 48px 40px}
  .vs-tm figure:first-child:nth-last-child(2) blockquote,.vs-tm figure:nth-child(2):last-child blockquote{font-size:34px;line-height:1.4}
  .vs-tm figure:only-child{border:0;padding:0;max-width:1480px}
  .vs-tm figure:only-child .vs-tm-mark{height:84px;font-size:150px}
  .vs-tm figure:only-child blockquote{font-family:var(--font-head);font-weight:500;font-size:54px;line-height:1.22;margin-bottom:44px}
  .vs-tm figure:only-child figcaption b{font-size:27px}
  .vs-tm figure:only-child figcaption span{font-size:23px}
  </style>
  {{#topic}}<div class="vs-topic">{{topic}}</div>{{/topic}}{{^topic}}{{#kicker}}<div class="vs-topic">{{kicker}}</div>{{/kicker}}{{/topic}}
  {{#title}}<h2>{{title}}</h2>{{/title}}
  <div class="vs-tm-grid">
    {{#items}}<figure class="anim"><span class="vs-tm-mark">“</span><blockquote>{{quote}}</blockquote><figcaption>{{#photo}}<img class="vs-tm-pic" src="{{photo}}" alt="">{{/photo}}{{#logo}}<img class="vs-tm-logo" src="{{logo}}" alt="">{{/logo}}<div><b>{{name}}</b><span>{{role}}</span></div></figcaption></figure>{{/items}}
  </div>
  {{notes}}
</section>
