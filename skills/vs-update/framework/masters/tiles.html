<section class="slide vs-til" {{attrs}}>
  <style>
  .vs-til .vs-ti{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:60px}
  .vs-til .vs-ti.c2{grid-template-columns:repeat(2,1fr)} .vs-til .vs-ti.c3{grid-template-columns:repeat(3,1fr)}
  .vs-til .vs-ti-t{display:grid;grid-template-columns:42% 1fr;min-height:190px;border:1px solid var(--line);background:var(--paper);overflow:hidden}
  .vs-til .vs-ti-t img{width:100%;height:100%;min-height:190px;object-fit:cover}
  .vs-til .vs-ti-t .vs-ti-none{background:var(--soft)}
  .vs-til .vs-ti-t div{padding:24px 24px 22px;align-self:center}
  .vs-til .vs-ti-t small{display:block;font-weight:700;font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-text);margin-bottom:8px}
  .vs-til .vs-ti-t h3{font-size:28px;line-height:1.2;font-weight:var(--w-head)}
  .vs-til .vs-ti-t p{font-size:22px;line-height:1.35;color:var(--muted);margin-top:6px}
  </style>
  {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
  <h2>{{title}}</h2>
  {{#lead}}<p class="lead">{{lead}}</p>{{/lead}}
  <div class="vs-ti {{#cols}}c{{cols}}{{/cols}}">{{#items}}<figure class="vs-ti-t anim">{{#photo}}<img src="{{photo}}" alt="">{{/photo}}{{^photo}}<span class="vs-ti-none"></span>{{/photo}}<div>{{#tag}}<small>{{tag}}</small>{{/tag}}<h3>{{title}}</h3>{{#text}}<p>{{text}}</p>{{/text}}</div></figure>{{/items}}</div>
  {{notes}}
</section>
