<!--vs {"name": "video_title", "order": 62, "use": "A video with its title above it: the title takes one line at the top, the video everything below, centred, as large as the slide allows and in its own shape (16:9, or what the film has). Nothing lies on the picture. The slide is always black, whatever the brand's colours are. For the video alone, without any text, use the master video.", "slots": {"src": "video file relative to the deck folder (mp4 with H.264 or webm), brand:<path> for a file of the brand library, or a YouTube, Vimeo or other https address", "poster": "still image shown before the video plays, in PDFs and overviews (strongly recommended)", "title": "the title above the video, one line (up to about 70 characters); <em> marks the accent word", "kicker": "small label above the title (optional)", "caption": "one line under the video (optional; it costs the video a little height)", "start": "start time: seconds, \"1:30\" or \"1m30s\" (optional)", "end": "end time (optional; not for Vimeo)", "autoplay": "true (default): plays when the slide becomes current; false: waits for K or a click", "loop": "true: repeats", "muted": "true: without sound", "fit": "\"contain\" (default): the whole frame is shown, a video is never cropped; \"cover\" fills the area and crops, only for footage where the edges do not matter", "controls": "true: the browser's own controls on a local video", "ratio": "shape of the video when it is not 16:9, e.g. \"9:16\", \"4:3\", \"1:1\"; a local file sets it by itself once it has loaded (optional)"}, "sample": {"src": "@video", "title": "The title stands above the <em>video</em>"}, "full_images": true, "title_as_name": true} -->
<section class="slide media dark no-footer vs-vt" {{attrs}}>
  <style>
  /* a film is shown on black, whatever the brand's colours are */
  .slide.vs-vt{display:flex;flex-direction:column;padding:150px var(--pad) 48px;background:#000!important;color:#fff}
  .vs-vt>.kicker{flex:none;margin:0 auto 10px}
  .vs-vt>h2{flex:none;font-size:46px;line-height:1.14;max-width:none;margin:0;text-align:center;color:#fff}
  .vs-vt>.mbox{flex:1 1 0;min-height:0;margin-top:30px;aspect-ratio:var(--ratio,16/9);align-self:center;max-width:100%;border-radius:var(--radius);background:#000}
  .vs-vt>.caption{flex:none;margin:12px 0 0;text-align:center;color:rgba(255,255,255,.75)}
  </style>
  {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
  <h2>{{title}}</h2>
  {{>video}}
  {{#caption}}<p class="caption">{{caption}}</p>{{/caption}}
  {{notes}}
</section>
