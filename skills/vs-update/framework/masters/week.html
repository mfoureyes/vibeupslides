<section class="slide" {{attrs}}>
  <h2>{{title}}</h2>
  {{#lead}}<p class="lead">{{lead}}</p>{{/lead}}
  <div class="vs-week">
    {{#days}}<div class="vs-wd anim"><div class="vs-wh"><i>{{day}}</i>{{date}}</div>{{#sessions}}<div class="vs-ws vs-{{kind}}"><b>{{time}}</b>{{title}}</div>{{/sessions}}</div>{{/days}}
  </div>
  {{#legend.0}}<div class="vs-wl">{{/legend.0}}{{#legend}}<span class="vs-{{kind}}">{{label}}</span>{{/legend}}{{#legend.0}}</div>{{/legend.0}}
  {{notes}}
</section>
