<section class="slide hz-look" {{attrs}}>
  <div class="hz-look-head">
    <div>{{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}<h2>{{title}}</h2></div>
    {{#lead}}<p class="lead">{{lead}}</p>{{/lead}}
  </div>
  <div class="band hz-tiles" data-seq>
    {{#items}}<div class="hz-tile anim">{{#photo}}<img src="{{photo}}" alt="">{{/photo}}<i class="hz-ti" aria-hidden="true"></i><b>.{{@ii}}</b><h3>{{title}}</h3></div>{{/items}}
  </div>
  {{notes}}
</section>
