<!--vs {"name": "chapter", "order": 20, "is_chapter": true, "use": "Opens a part of the deck over a vivid evening horizon with a lake and a small figure standing at its shore: an outlined pill at the top, the title in a large serif centred in two lines with a brush stroke under it; <em> marks a small word set underlined between the lines; small labels in the top corners. Title up to four words.", "slots": {"number": "chapter number, 1 to 99", "kicker": "small label in the top-left corner (optional)", "pill": "the word in the pill at the top (optional, default: Chapter and its number)", "title": "name of the chapter, up to four words; <em> marks one small linking word", "lead": "a short line in the top-right corner, up to six words (optional)"}, "sample": {"number": 1, "kicker": "Part one", "title": "A title <em>for</em> this part", "lead": "One line on what comes in it"}} -->
<section class="slide chapter hz-chap{{#motion}} mslide mchap{{/motion}}" {{attrs}}>
  <div class="band hz-sky" aria-hidden="true"></div><i class="hz-figure" aria-hidden="true"></i>
  {{#kicker}}<div class="hz-tl">{{kicker}}</div>{{/kicker}}{{#lead}}<div class="hz-tr">{{lead}}</div>{{/lead}}
  <div class="text">
    <span class="hz-pill anim">{{#pill}}{{pill}}{{/pill}}{{^pill}}Chapter {{number}}{{/pill}}</span>
    <h2 class="vs-fill" data-max="250" data-min="130" data-lines="2">{{title}}</h2>
    <i class="hz-stroke" aria-hidden="true"></i>
  </div>
  {{notes}}
</section>
