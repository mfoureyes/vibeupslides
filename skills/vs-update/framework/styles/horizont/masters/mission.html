<section class="slide hz-mis" {{attrs}}>
  {{#kicker}}<div class="hz-tl">{{kicker}}</div>{{/kicker}}
  <div class="hz-lines" data-seq>
    {{#lines}}<div class="hz-line anim">{{#side}}<span class="hz-side">{{side}}</span>{{/side}}<span class="t">{{text}}</span>{{#photo}}<span class="hz-pic"><img src="{{photo}}" alt=""></span>{{/photo}}{{#after}}<span class="t">{{after}}</span>{{/after}}{{#note}}<span class="hz-note">{{note}}</span>{{/note}}</div>{{/lines}}
  </div>
  {{#lead}}<p class="lead">{{lead}}</p>{{/lead}}
  {{notes}}
</section>
