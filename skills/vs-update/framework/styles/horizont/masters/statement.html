<!--vs {"name": "statement", "order": 30, "use": "One sentence alone on white, set centred in a large serif with small plus signs around it and a short note beside it.", "slots": {"text": "the sentence, up to 16 words", "who": "attribution or a short note, set small with a dash (optional)"}, "sample": {"text": "A good room tells you where to look before anyone says a word.", "who": "From our notebook"}} -->
<section class="slide statement hz-stm{{#motion}} mslide mstatement{{/motion}}" {{attrs}}>
  <i class="hz-plus p1" aria-hidden="true"></i><i class="hz-plus p2" aria-hidden="true"></i><i class="hz-plus p3" aria-hidden="true"></i>
  <div class="text"><h2{{#motion}} class="mtext"{{/motion}}>{{text}}</h2>{{#who}}<div class="who">{{who}}</div>{{/who}}</div>
  {{notes}}
</section>
