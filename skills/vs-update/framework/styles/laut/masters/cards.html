<section class="slide lt-cards" {{attrs}}>
  {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
  <h2>{{title}}</h2>
  <div class="lt-grid" style="--c:{{cols}}" data-seq>
    {{#items}}<div class="lt-card anim {{style}}"><i class="lt-sun" aria-hidden="true"></i><span class="lt-chip">{{#n}}{{n}}{{/n}}{{^n}}{{@ii}}{{/n}}{{#tag}} · {{tag}}{{/tag}}</span><h3>{{title}}</h3><p>{{text}}</p></div>{{/items}}
  </div>
  {{notes}}
</section>
