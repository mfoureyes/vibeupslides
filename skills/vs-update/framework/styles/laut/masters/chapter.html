<!--vs {"name": "chapter", "order": 20, "is_chapter": true, "use": "Opens a part of the deck on paper: the name huge in violet capitals, the closing words in red, the number giant in pink behind, a red chip and a short line at the top. Its title becomes the chapter name in outline and top line. Title two to five short words.", "slots": {"number": "chapter number, 1 to 99", "kicker": "small label in the red chip (optional)", "title": "name of the chapter, two to five short words; <em> marks the closing words in red", "lead": "one or two sentences in small capitals at the top right (optional)"}, "sample": {"number": 1, "kicker": "Part one", "title": "A short title for this <em>part of the deck.</em>", "lead": "One or two sentences that say what this part is about and why it comes now, before the next one."}} -->
<section class="slide chapter lt-chap{{#motion}} mslide mchap mcount{{/motion}}" {{attrs}}>
  <div class="lt-num" aria-hidden="true">{{#motion}}{{>chapter_number number}}{{/motion}}{{^motion}}<div class="ghost">{{number}}</div>{{/motion}}</div>
  <div class="lt-head">{{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}{{^kicker}}<span></span>{{/kicker}}<i class="lt-star lt-spin" aria-hidden="true"></i>{{#lead}}<p class="lt-small lt-lead anim">{{lead}}</p>{{/lead}}</div>
  <div class="text"><h2 class="vs-fill{{#motion}} mtext{{/motion}}" data-max="250" data-min="120">{{title}}</h2></div>
  {{notes}}
</section>
