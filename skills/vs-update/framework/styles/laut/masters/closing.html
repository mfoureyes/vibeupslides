<!--vs {"name": "closing", "order": 90, "use": "Last slide on violet, the twin of the cover: a giant word behind, one sentence in red capitals, contacts and a button, the thanks in pink running off the foot. Title one or two short words.", "slots": {"kicker": "small label in a red chip (optional)", "word": "one word set giant in a darker violet behind (optional)", "title": "e.g. Thank you., one or two short words", "lead": "one sentence in red capitals, up to 14 words", "contacts": "list of {label, value}, at most three", "button": "a call to action as a link: {label, url} (optional)"}, "sample": {"word": "Hello", "title": "Thank you<em>.</em>", "lead": "Questions are welcome, and so is a coffee in the studio.", "contacts": [{"label": "Web", "value": "example.com"}, {"label": "Mail", "value": "hello@example.com"}], "button": {"label": "Get in touch", "url": "https://example.com"}}} -->
<section class="slide dark cover lt-cov lt-close{{#motion}} mslide mcover{{/motion}}" {{attrs}}>
  {{#word}}<div class="band lt-ghost" aria-hidden="true"><span class="vs-fill" data-max="640" data-min="240" data-lines="1">{{word}}</span></div>{{/word}}
  <div class="lt-top"><span class="lt-chip lt-arrow anim" aria-hidden="true"><svg viewBox="0 0 64 40" aria-hidden="true"><path d="M2 20h56M40 3l18 17-18 17" fill="none" stroke="currentColor" stroke-width="4"/></svg></span></div>
  <div class="lt-lead">{{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}{{#lead}}<p class="lead vs-overlap anim">{{lead}}</p>{{/lead}}
    {{#contacts.0}}<div class="lt-contacts anim">{{/contacts.0}}{{#contacts}}<div><small>{{label}}</small>{{value}}</div>{{/contacts}}{{#contacts.0}}</div>{{/contacts.0}}
    {{#button}}{{#url}}<a class="vs-btn anim" href="{{url}}" target="_blank" rel="noopener" onclick="event.stopPropagation()">{{label}}</a>{{/url}}{{/button}}</div>
  <div class="band lt-foot"><h1 class="vs-fill vs-overlap" data-max="440" data-min="200" data-lines="1">{{title}}</h1><i class="lt-star lt-spin" aria-hidden="true"></i></div>
  {{notes}}
</section>
