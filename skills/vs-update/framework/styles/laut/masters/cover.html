<!--vs {"name": "cover", "order": 10, "prepare": "display", "use": "Opening slide on violet like a campaign poster: a giant word in a darker tone behind, a paragraph in red capitals over it, the title in pink from edge to edge running off the foot, small lines in the serif at the top. Short is stronger: title one or two words, word one word, lead up to 18 words.", "slots": {"kicker": "small label in a red chip above the lead (optional)", "word": "one word set giant in a darker violet behind everything (optional)", "title": "the deck title, one or two short words, set from edge to edge at the foot (a longer title breaks into two lines that stand above it); <em> marks a part set in red", "lead": "a sentence in red capitals over the giant word, up to 18 words", "tagline": "a short line in the serif beside the arrow chip, up to six words (optional)", "date": "a short line in the serif at the top right; <em> marks the part in red, e.g. <em>Since.</em><br>2016 (optional)", "about": "two sentences in small capitals under the date (optional)"}, "sample": {"word": "Studio", "title": "Nord<em>.</em>", "lead": "It is a studio that turns plans into tools people like to use, every single day.", "tagline": "Is not just a planning studio", "date": "<em>Since.</em><br>2016", "about": "Our work revolves around one idea: a good plan does not have to be complicated, and everyone should be able to read it.", "notes": "Welcome, one sentence on why we are here."}, "defaults": {}} -->
<section class="slide dark cover lt-cov{{#motion}} mslide mcover{{/motion}}" {{attrs}}>
  {{#word}}<div class="band lt-ghost" aria-hidden="true"><span class="vs-fill" data-max="640" data-min="240" data-lines="1">{{word}}</span></div>{{/word}}
  <div class="lt-top"><span class="lt-chip lt-arrow anim" aria-hidden="true"><svg viewBox="0 0 64 40" aria-hidden="true"><path d="M2 20h56M40 3l18 17-18 17" fill="none" stroke="currentColor" stroke-width="4"/></svg></span>{{#tagline}}<p class="lt-serif lt-tag anim">{{tagline}}</p>{{/tagline}}</div>
  <div class="lt-side">{{#date}}<p class="lt-serif lt-since anim">{{date}}</p>{{/date}}{{#about}}<p class="lt-small lt-about anim">{{about}}</p>{{/about}}</div>
  <div class="lt-lead">{{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}{{#lead}}<p class="lead vs-overlap anim">{{lead}}</p>{{/lead}}</div>
  <div class="band lt-foot"><h1 class="vs-fill vs-overlap{{^_wrap_title}} vs-bleed{{/_wrap_title}}{{#_wrap_title}} lt-wrap{{/_wrap_title}}" data-max="560" data-min="220" data-lines="{{#_wrap_title}}2{{/_wrap_title}}{{^_wrap_title}}1{{/_wrap_title}}">{{title}}</h1><i class="lt-star lt-spin" aria-hidden="true"></i></div>
  {{notes}}
</section>
