<section class="slide accent lt-frame" {{attrs}}>
  <div class="band lt-photo">{{#photo}}<img src="{{photo}}" alt="">{{/photo}}
    {{#name}}<div class="lt-name anim">{{name}}</div>{{/name}}
    <div class="lt-q"><i class="lt-star lt-spin" aria-hidden="true"></i><h2 class="anim">{{title}}</h2></div>
    {{#mark}}<div class="lt-mark" aria-hidden="true"><span class="lt-up">{{mark}}</span></div>{{/mark}}
  </div>
  <div class="band lt-band">
    <div class="lt-left"><i class="lt-sun" aria-hidden="true"></i>{{#tag}}<p class="lt-serif lt-tag anim">{{tag}}</p>{{/tag}}</div>
    <p class="lt-text anim">{{text}}</p>
    <div class="lt-right">{{#aside}}<p class="lt-small lt-aside anim">{{aside}}</p>{{/aside}}{{#button}}{{#url}}<a class="vs-btn anim" href="{{url}}" target="_blank" rel="noopener" onclick="event.stopPropagation()">{{label}}</a>{{/url}}{{/button}}</div>
  </div>
  {{notes}}
</section>
