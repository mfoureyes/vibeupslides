<section class="slide dark lt-kpis" {{attrs}}>
  <i class="lt-star lt-spin" aria-hidden="true"></i>
  {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
  <h2>{{title}}</h2>
  <div class="lt-figs" data-seq>
    {{#items}}<div class="lt-fig anim"><div class="w"><span class="mcountup">{{value}}</span>{{#unit}}<small>{{unit}}</small>{{/unit}}</div><div class="b lt-small">{{label}}</div></div>{{/items}}
  </div>
  {{notes}}
</section>
