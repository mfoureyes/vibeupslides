<section class="slide statement lt-stm{{#motion}} mslide mstatement{{/motion}}" {{attrs}}>
  <div class="lt-bg" aria-hidden="true"><i class="lt-star lt-turn"></i></div>
  <div class="lt-head"><i class="lt-star lt-spin" aria-hidden="true"></i><p class="lt-small lt-note">{{note}}</p>{{#aside}}<p class="lt-serif lt-aside anim">{{aside}}</p>{{/aside}}</div>
  <div class="text"><h2{{#motion}} class="mtext"{{/motion}}>{{text}}</h2></div>
  <div class="lt-base"><i class="lt-sun lt-roll" aria-hidden="true"></i>{{#who}}<p class="lt-small lt-who anim">{{who}}</p>{{/who}}</div>
  {{notes}}
</section>
