<section class="slide mf-rows" {{attrs}}>
  {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
  <h2>{{title}}</h2>
  <div class="mf-list" data-seq>
    {{#items}}<div class="mf-row anim {{style}}"><b>{{#n}}{{n}}{{/n}}{{^n}}{{@ii}}{{/n}}.</b><h3>{{title}}</h3><p>{{#tag}}<small>{{tag}}</small>{{/tag}}{{text}}</p></div>{{/items}}
  </div>
  {{notes}}
</section>
