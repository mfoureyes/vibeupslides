<section class="slide mf-claim" {{attrs}}>
  <div class="band mf-red">
    <h2 class="vs-fill" data-max="420" data-min="180" data-lines="1">{{_head}}<span class="mf-photo anim">{{#photo}}<img src="{{photo}}" alt="">{{/photo}}</span><br>{{_rest}}</h2>
  </div>
  <div class="band mf-panel">
    <div class="mf-ruler" aria-hidden="true"><span>040</span><span>050</span><span>060</span><span>070</span><span>080</span><span>090</span></div>
    <div class="mf-inst">{{#code}}<span class="mf-tagbox">{{code}}</span>{{/code}}<svg class="mf-sphere" viewBox="0 0 660 660" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2"><ellipse cx="330" cy="330" rx="289.8" ry="300"/><ellipse cx="330" cy="330" rx="259.8" ry="300"/><ellipse cx="330" cy="330" rx="212.1" ry="300"/><ellipse cx="330" cy="330" rx="150.0" ry="300"/><ellipse cx="330" cy="330" rx="77.6" ry="300"/><ellipse cx="330" cy="330" rx="0.0" ry="300"/><ellipse cx="330" cy="330" rx="77.6" ry="300"/><ellipse cx="330" cy="330" rx="150.0" ry="300"/><ellipse cx="330" cy="330" rx="212.1" ry="300"/><ellipse cx="330" cy="330" rx="259.8" ry="300"/><ellipse cx="330" cy="330" rx="289.8" ry="300"/><ellipse cx="330" cy="619.8" rx="77.6" ry="17.1"/><ellipse cx="330" cy="589.8" rx="150.0" ry="33.0"/><ellipse cx="330" cy="542.1" rx="212.1" ry="46.7"/><ellipse cx="330" cy="480.0" rx="259.8" ry="57.2"/><ellipse cx="330" cy="407.6" rx="289.8" ry="63.8"/><ellipse cx="330" cy="330.0" rx="300.0" ry="66.0"/><ellipse cx="330" cy="252.4" rx="289.8" ry="63.8"/><ellipse cx="330" cy="180.0" rx="259.8" ry="57.2"/><ellipse cx="330" cy="117.9" rx="212.1" ry="46.7"/><ellipse cx="330" cy="70.2" rx="150.0" ry="33.0"/><ellipse cx="330" cy="40.2" rx="77.6" ry="17.1"/><circle cx="330" cy="330" r="300"/></g></svg><span class="mf-diamond" aria-hidden="true"></span></div>
    {{#value}}<div class="mf-coord anim">{{value}}<small>{{unit}}</small></div>{{/value}}
    <p class="anim">{{label}}</p>
  </div>
  <div class="band mf-cream">
    <p class="mf-addr">{{aside}}</p>
    <div class="mf-reasons" data-seq>{{#items}}<div class="mf-reason anim"><b>{{@ii}}.</b><h3>{{title}}</h3><p>{{text}}</p></div>{{/items}}</div>
  </div>
  {{notes}}
</section>
