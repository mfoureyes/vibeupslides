<!--vs {"name": "cover", "order": 10, "prepare": "display", "use": "Opening slide in three bands: the title from edge to edge on red, a short line in the serif on cream, a line about the occasion on black. Short is stronger: a title of one to four words, a line of two to five.", "slots": {"kicker": "small label at the foot of the cream band, in red (optional)", "title": "the deck title, one to four words; <em> marks the word set in cream", "lead": "a short line in the serif, two to five words; <em> marks the closing words, set in red on a line of their own over the first", "date": "a short line top left of the cream band, e.g. a period or a year (optional)", "about": "two or three sentences for the black band, set in small capitals (optional)", "tagline": "a short line on the right of the black band (optional)"}, "sample": {"kicker": "We believe a good plan does not have to be complicated.", "date": "2022–<br>today", "title": "Studio<em>Nord</em>", "lead": "Continued <em>innovation.</em>", "about": "Two or three sentences in small capitals: what the talk is about, for whom and why now. They fill the black band at the foot from margin to margin.", "tagline": "Where the point of the deck stands", "notes": "Welcome, one sentence on why we are here."}} -->
<section class="slide accent cover mf-cov{{#motion}} mslide mcover{{/motion}}" {{attrs}}>
  <div class="band mf-band mf-red"><h1 class="vs-fill{{#motion}} mtext{{/motion}}" data-max="440" data-min="240">{{title}}</h1></div>
  <div class="band mf-band mf-cream">
    <div class="mf-side"><div class="mf-date">{{date}}</div>{{#kicker}}<div class="mf-claimline">{{kicker}}</div>{{/kicker}}</div>
    {{#lead}}<p class="lead mf-display vs-overlap vs-fill{{#_tail_lead}} mf-tail{{/_tail_lead}}" data-max="220" data-min="110">{{lead}}</p>{{/lead}}
    <span class="mf-plus" aria-hidden="true">+</span>
  </div>
  <div class="band mf-band mf-black">
    <p class="mf-just">{{about}}</p><span class="mf-star" aria-hidden="true">&#10022;</span><p class="mf-tag">{{tagline}}</p>
  </div>
  {{notes}}
</section>
