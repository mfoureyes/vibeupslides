<section class="slide dark mf-svc" {{attrs}}>
  <div class="band mf-word"><span class="vs-fill" data-max="330" data-min="120" data-lines="1">{{word}}</span></div>
  <div class="band mf-mid">
    {{#kicker}}<div class="mf-top"><span>{{kicker}}</span><span class="mf-star" aria-hidden="true">&#10022;</span></div>{{/kicker}}
    <h2 class="anim">{{title}}</h2>
    {{#note}}<div class="mf-note">{{note}}</div>{{/note}}
    {{#text}}<p class="mf-box anim">{{text}}</p>{{/text}}
  </div>
  <ul class="band mf-strip" data-seq>{{#items}}<li class="anim">{{.}}</li>{{/items}}</ul>
  {{notes}}
</section>
