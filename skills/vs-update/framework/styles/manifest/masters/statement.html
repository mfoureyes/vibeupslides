<section class="slide dark statement mf-stm{{#figure}} mf-side{{/figure}}{{#box}} mf-side{{/box}}{{#motion}} mslide mstatement{{/motion}}" {{attrs}}>
  <div class="text"><h2 class="vs-fill vs-overlap{{#_tail_text}} mf-tail{{/_tail_text}}{{#_long_text}} mf-long{{/_long_text}}{{#motion}} mtext{{/motion}}" data-max="380" data-min="230">{{text}}</h2></div>
  <aside class="mf-col">{{#figure}}<div class="mf-stack anim">{{figure}}</div>{{/figure}}{{#aside}}<p class="mf-red-line anim">{{aside}}</p>{{/aside}}{{#box}}<p class="mf-box anim">{{box}}</p>{{/box}}</aside>
  <div class="mf-foot"><span>{{who}}</span><span class="mf-star" aria-hidden="true">&#10022;</span><span class="mf-mark">{{mark}}</span></div>
  {{notes}}
</section>
