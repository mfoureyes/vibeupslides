<section class="slide sc-need" {{attrs}}>
  <div class="band sc-frost" aria-hidden="true"></div>
  {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
  <h2>{{title}}</h2>
  <div class="sc-steps" data-seq>
    {{#items}}<div class="sc-card anim {{style}}"><i class="sc-ic"></i><h3>{{title}}</h3>{{#text}}<p>{{text}}</p>{{/text}}</div>{{/items}}
  </div>
  {{notes}}
</section>
