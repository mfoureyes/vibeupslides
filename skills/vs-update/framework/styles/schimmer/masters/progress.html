<!--vs {"name": "progress", "order": 67, "use": "A score over days or weeks as rounded columns: each with its value in a pill above, the one that counts in the accent colour, the rest of each column hatched; the overall score large above. Five to eight columns, values in percent.", "slots": {"title": "short title", "label": "what the score is, small at the right (optional)", "value": "the overall score, e.g. 92", "unit": "its unit (default %)", "rows": "list of {label, value}: value 0 to 100", "mark": "number of the column that counts (1 is the first)"}, "defaults": {"unit": "%"}, "sample": {"title": "Weekly plant overview", "label": "Readiness score", "value": "92", "mark": 3, "rows": [{"label": "Mon", "value": 66}, {"label": "Tue", "value": 87}, {"label": "Wed", "value": 92}, {"label": "Thu", "value": 72}, {"label": "Fri", "value": 70}, {"label": "Sat", "value": 78}, {"label": "Sun", "value": 30}], "source": "Sample figures"}} -->
<section class="slide sc-prog" {{attrs}}>
  <div class="sc-head"><h2>{{title}}</h2>{{#label}}<span class="sc-label">{{label}}</span>{{/label}}</div>
  <div class="sc-score"><span class="mcountup">{{value}}</span>{{unit}}</div>
  <div class="sc-cols" data-mark="{{mark}}">
    {{#rows}}<div class="sc-col" style="--h:{{value}}%;--i:{{@i}}"><b>{{value}}{{unit}}</b><div class="sc-bar"><i></i></div><span>{{label}}</span></div>{{/rows}}
  </div>
  {{notes}}
</section>
