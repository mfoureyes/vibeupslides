<section class="slide sb-cards" {{attrs}}>
  {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
  <h2>{{title}}</h2>
  <div class="sb-crow" data-seq>
    {{#items}}<div class="sb-card anim {{style}}"><div class="sb-print">{{#photo}}<img src="{{photo}}" alt=""><b class="sb-tag">{{@ii}}</b>{{/photo}}{{^photo}}<span class="sb-num sb-big" aria-hidden="true">{{@ii}}</span>{{/photo}}</div><h3>{{title}}</h3>{{#text}}<p>{{text}}</p>{{/text}}</div>{{/items}}
  </div>
  {{notes}}
</section>
