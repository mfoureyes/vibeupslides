<section class="slide sb-kp" {{attrs}}>
  {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
  <h2>{{title}}</h2>
  <div class="sb-kp-row" data-seq>
    {{#items}}<div class="sb-kp-i anim"><div class="w sb-num"><span class="mcountup">{{value}}</span>{{#unit}}<small>{{unit}}</small>{{/unit}}</div><p>{{label}}</p></div>{{/items}}
  </div>
  {{notes}}
</section>
