  {{#photo}}<div class="band sb-photo" aria-hidden="true"><img src="{{photo}}" alt=""></div>{{/photo}}
  {{>bgvideo}}
  <h2><span>{{text}}</span></h2>
  {{#credit}}<div class="vs-stp-credit">{{credit}}</div>{{/credit}}
