<section class="slide dark statement sb-stm{{#motion}} mslide mstatement{{/motion}}" {{attrs}}>

  <i class="sb-star s1" aria-hidden="true"></i><i class="sb-star s2" aria-hidden="true"></i>
  <div class="text"><h2{{#motion}} class="mtext"{{/motion}}>{{text}}</h2>{{#who}}<div class="who">{{who}}</div>{{/who}}</div>
  <i class="band sb-tape" aria-hidden="true"><b></b></i>
  {{notes}}
</section>
